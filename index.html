<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbe4ec">
<title>我的小日记 🌸</title>
<style>
  :root{
    --sky1:#fde9f0; --sky2:#f8dbe7; --sky3:#ece2f6;
    --ink:#4a3346; --ink-soft:#7d6178;
    --paper:#fffaf5; --rule:rgba(214,150,175,0.22);
    --sakura:#f4a7c0; --sakura-deep:#d9668e;
    --L:1.85em;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,255,255,0.7), transparent 70%),
      radial-gradient(ellipse 60% 40% at 85% 85%, rgba(214,190,240,0.45), transparent 70%),
      linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 50%, var(--sky3) 100%);
    color:var(--ink);
    font-family:'Kaiti SC','STKaiti','KaiTi','Noto Serif CJK SC','Noto Serif SC','Songti SC','SimSun',serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }

  .branch{ position:fixed; z-index:1; pointer-events:none; }
  .branch.left{ top:-10px; left:-14px; width:min(58vw,360px); }
  .branch.right{ top:14vh; right:-16px; width:min(42vw,250px); transform:scaleX(-1); opacity:0.9; }
  .branch svg{ width:100%; height:auto; display:block; overflow:visible; }
  .sway{ transform-origin:0 0; animation:sway 7s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(-0.8deg); } to{ transform:rotate(1.2deg); } }

  #petals{ position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #flies{ position:fixed; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }
  #petalsTop{ position:fixed; inset:0; width:100%; height:100%; z-index:9; pointer-events:none; }

  /* ---------- portada ---------- */
  #coverWrap{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    perspective:1600px;
    transition:opacity 1s ease 0.9s;
  }
  #coverWrap.gone{ opacity:0; pointer-events:none; }
  .cover{
    position:relative; cursor:pointer;
    width:min(76vw,320px); aspect-ratio:3/4.1;
    border-radius:8px 18px 18px 8px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.35), transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px),
      linear-gradient(140deg, #f6b9cc, #e88aa9 60%, #d9708f);
    box-shadow:0 30px 60px rgba(150,60,100,0.35), inset 8px 0 0 rgba(0,0,0,0.08), inset 0 0 40px rgba(120,30,70,0.18);
    transform-origin:left center;
    transition:transform 1.5s cubic-bezier(.6,.05,.25,1);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .cover.open{ transform:rotateY(-165deg); }
  .cover .ribbon{
    position:absolute; top:-6px; right:9%; width:18px; height:calc(100% + 34px);
    background:linear-gradient(90deg,#c84f78,#e47b9f,#c84f78);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 94%,0 100%);
  }
  .cover .label{
    position:relative; margin-right:12%;
    background:rgba(255,250,246,0.92); color:var(--ink);
    border-radius:12px; padding:1.3rem 1.4rem 1.1rem;
    box-shadow:0 6px 18px rgba(120,40,80,0.18);
  }
  .cover .label{ display:flex; flex-direction:column; align-items:center; padding:0; margin-right:6%; background:none !important; box-shadow:none !important; border-radius:0; }
  .cover .label .rose{ width:96px; height:auto; display:block; filter:drop-shadow(0 6px 10px rgba(110,20,55,0.35)); }
  .cover .label h1{ margin-top:0.7rem; font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:clamp(1.7rem,7.5vw,2.2rem); letter-spacing:0.32em; padding-left:0.32em; color:#fff7f3; text-shadow:0 2px 10px rgba(120,30,70,0.45); }
  .cover .label p{ margin-top:0.5rem; font-size:0.9rem; letter-spacing:0.3em; color:var(--sakura-deep); }
  .cover .flower-badge{ position:absolute; width:74px; left:14%; bottom:12%; }
  .coverDays{
    margin-top:2rem; font-size:1rem; letter-spacing:0.12em; color:var(--ink);
    background:rgba(255,255,255,0.6); padding:0.5em 1.3em; border-radius:999px;
    box-shadow:0 4px 14px rgba(200,120,160,0.15);
  }
  .tapHint{ margin-top:1.1rem; color:var(--ink-soft); font-size:0.95rem; letter-spacing:0.25em; animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }

  /* ---------- el libro ---------- */
  #stage{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    opacity:0; transition:opacity 1.2s ease;
    pointer-events:none;
  }
  #stage.show{ opacity:1; pointer-events:auto; }
  .days{
    font-size:0.88rem; letter-spacing:0.1em; color:var(--ink);
    background:rgba(255,255,255,0.65); padding:0.3em 1.1em; border-radius:999px;
    margin-bottom:8px; box-shadow:0 4px 12px rgba(200,120,160,0.15);
    white-space:nowrap;
  }
  .days b{ color:var(--sakura-deep); font-weight:600; font-size:1.15em; }
  #book{
    position:relative;
    width:min(94vw, 560px);
    height:min(calc(100vh - 112px), 860px);
    perspective:1400px; perspective-origin:30% 50%;
  }
  .spine{
    position:absolute; left:-6px; top:6px; bottom:6px; width:14px; border-radius:6px 0 0 6px;
    background:linear-gradient(90deg,#c95f83,#e996b1);
    box-shadow:-3px 4px 10px rgba(150,60,100,0.25);
  }
  .stack{ /* hojas de abajo, para que se vea grueso */
    position:absolute; inset:0; border-radius:4px 16px 16px 4px;
    background:#f6ece6;
    box-shadow:3px 3px 0 #efe2da, 6px 6px 0 #e9dad1, 0 24px 50px rgba(150,70,110,0.25);
  }
  .page{
    position:absolute; inset:0;
    border-radius:4px 16px 16px 4px;
    background-color:var(--paper);
    background-image:
      linear-gradient(90deg, rgba(0,0,0,0.06), transparent 18px),
      radial-gradient(circle at 100% 0%, rgba(248,200,216,0.28), transparent 38%);
    padding:30px 18px 38px 24px;
    transform-origin:left center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:none;
    overflow:hidden;
    font-size:clamp(15.5px, 4.15vw, 18px);
  }
  .page.cur, .page.under, .page.measure{ display:block; }
  .page.cur{ z-index:3; }
  .page.under{ z-index:2; }
  .page.measure{ visibility:hidden; z-index:0; }
  .page .content{
    position:relative; height:100%; overflow:hidden;
    background-image:linear-gradient(to bottom, transparent calc(var(--L) - 1px), var(--rule) calc(var(--L) - 1px), var(--rule) var(--L));
    background-size:100% var(--L);
  }
  .page p{
    line-height:var(--L); letter-spacing:0.03em; color:var(--ink);
    text-indent:2em; margin-bottom:0;
  }
  .page p.cont{ text-indent:0; }
  .page p.em{ margin:var(--L) 0; text-indent:0; text-align:center; color:var(--sakura-deep); font-size:1.2em; letter-spacing:0.15em; }
  .page p:last-child{ margin-bottom:0; }
  .page .tape{
    display:block; width:max-content; max-width:100%;
    margin:0 auto var(--L); line-height:var(--L);
    background:repeating-linear-gradient(90deg, rgba(247,190,209,0.92) 0 9px, rgba(251,214,225,0.92) 9px 18px);
    color:#7a3a57; padding:0 1.1em; letter-spacing:0.12em;
    transform:rotate(-1.5deg); border-radius:3px;
    box-shadow:0 2px 6px rgba(160,80,110,0.15);
  }
  .page .num{
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-size:13px; letter-spacing:0.2em; color:#b7949f;
  }
  .page .corner{ position:absolute; width:34px; right:10px; bottom:6px; opacity:0.5; }

  /* página de título */
  .titlePage{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:1.2em; }
  .titlePage h2{ font-weight:400; font-size:2em; letter-spacing:0.25em; padding-left:0.25em; }
  .titlePage .sub{ color:var(--sakura-deep); letter-spacing:0.3em; }
  .titlePage .big{ font-size:3.4em; color:var(--sakura-deep); line-height:1.1; }
  .titlePage .small{ color:var(--ink-soft); font-size:0.9em; letter-spacing:0.1em; }
  .titlePage svg{ width:70px; height:70px; }
  .titlePage .swipe{ margin-top:1em; font-size:0.85em; color:#b7949f; letter-spacing:0.2em; }

  /* índice */
  .toc{ background:var(--paper); border-radius:6px; }
  .toc h3{ text-align:center; font-weight:400; letter-spacing:0.4em; padding-left:0.4em; line-height:1.6em; margin-bottom:0.2em; color:var(--sakura-deep); font-size:1.15em; }
  .toc a{
    display:flex; align-items:center; gap:0.4em; line-height:1.6em; font-size:0.9em;
    color:var(--ink); text-decoration:none; cursor:pointer;
    border-radius:8px; padding:0 0.3em; margin:0 -0.3em;
    transition:background 0.2s ease;
  }
  .toc a:active, .toc a:hover{ background:rgba(244,167,192,0.18); }
  .toc a .n{ color:var(--sakura-deep); }
  .toc a .go{ color:var(--sakura-deep); font-size:0.85em; opacity:0.8; }
  .toc .tip{ text-align:center; font-size:0.8em; color:#b7949f; letter-spacing:0.15em; line-height:1.6em; margin-bottom:0.5em; }
  .toc .more{ text-align:right; font-size:0.85em; color:var(--sakura-deep); line-height:1.8em; margin-top:0.3em; letter-spacing:0.1em; }
  .toc a .dots{ flex:1; border-bottom:1px dotted #d9b3c2; transform:translateY(-0.35em); }
  .toc a .new{ font-size:0.7em; color:#fff; background:var(--sakura-deep); border-radius:4px; padding:0 0.4em; line-height:1.6; }

  /* final */
  .endPage{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; }
  .endPage > svg{ width:76px; height:76px; margin-bottom:0.6em; }
  .endPage h2{ font-weight:400; font-size:3em; letter-spacing:0.2em; padding-left:0.2em; color:var(--sakura-deep); text-shadow:0 4px 18px rgba(217,102,142,0.3); }
  .endPage .sign{ margin-top:0.8em; font-size:1.3em; color:var(--ink-soft); }
  .endPage .again{ margin-top:2.2em; font-size:0.85em; color:var(--sakura-deep); border:1px solid rgba(217,102,142,0.4); border-radius:999px; padding:0.4em 1.3em; background:transparent; font-family:inherit; cursor:pointer; }

  /* animación de pasar hoja */
  .page.fwd{ animation:turnFwd 0.75s cubic-bezier(.45,.05,.4,1) forwards; z-index:4; }
  .page.back{ animation:turnBack 0.75s cubic-bezier(.45,.05,.4,1) forwards; z-index:4; }
  @keyframes turnFwd{
    0%{ transform:rotateY(0deg); filter:brightness(1); }
    60%{ filter:brightness(0.93); }
    100%{ transform:rotateY(92deg); filter:brightness(0.85); opacity:0.6; }
  }
  @keyframes turnBack{
    0%{ transform:rotateY(92deg); filter:brightness(0.85); opacity:0.6; }
    100%{ transform:rotateY(0deg); filter:brightness(1); opacity:1; }
  }

  .nav{
    display:flex; align-items:center; gap:14px; margin-top:10px;
  }
  .nav button.tocBtn{
    width:auto; height:36px; border-radius:999px; padding:0 1em; font-size:0.9rem; letter-spacing:0.15em;
  }
  .nav button{
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(217,102,142,0.35); background:rgba(255,255,255,0.7);
    color:var(--sakura-deep); font-size:20px; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 12px rgba(200,120,160,0.15);
  }
  .nav button:disabled{ opacity:0.35; cursor:default; }
  .nav .pg{ min-width:80px; text-align:center; font-size:0.95rem; color:var(--ink-soft); letter-spacing:0.1em; }

  @media (prefers-reduced-motion: reduce){
    .sway, .tapHint{ animation:none; }
    .cover{ transition:none; }
    .page.fwd, .page.back{ animation-duration:0.01s; }
    #petals, #flies, #petalsTop{ display:none; }
  }
</style>
</head>
<body>

<div class="branch left" aria-hidden="true"><svg id="branchL" viewBox="0 0 330 270"></svg></div>
<div class="branch right" aria-hidden="true"><svg id="branchR" viewBox="0 0 330 270"></svg></div>
<canvas id="petals"></canvas>
<canvas id="flies"></canvas>

<div id="coverWrap">
  <div class="cover" id="cover" role="button" aria-label="打开日记">
    <div class="ribbon"></div>
    <div class="label">
      <svg class="rose" viewBox="0 0 120 200" aria-hidden="true">
        <path d="M60 96 C 57 125, 63 160, 60 196" stroke="#3f7a52" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M60 140 C 44 128, 30 132, 24 142 C 36 150, 50 150, 60 140 Z" fill="#5c9a6a"/>
        <path d="M60 140 C 48 138, 36 140, 24 142" stroke="#3f7a52" stroke-width="1" fill="none"/>
        <path d="M61 166 C 76 152, 92 154, 98 164 C 86 174, 72 174, 61 166 Z" fill="#5c9a6a"/>
        <path d="M61 166 C 74 163, 86 163, 98 164" stroke="#3f7a52" stroke-width="1" fill="none"/>
        <path d="M60 94 L 48 104 L 58 100 L 60 110 L 63 100 L 73 104 Z" fill="#4f8a5e"/>
        <path d="M30 66 C 24 38, 48 20, 61 29 C 76 19, 99 37, 91 66 C 87 88, 72 98, 60 98 C 47 98, 33 89, 30 66 Z" fill="#b92d55"/>
        <path d="M37 60 C 35 42, 55 31, 64 40 C 75 33, 89 46, 83 64 C 79 79, 67 87, 60 87 C 50 87, 39 77, 37 60 Z" fill="#d9466f"/>
        <path d="M45 56 C 45 44, 59 39, 64 47 C 71 43, 79 52, 75 62 C 71 71, 63 75, 58 73 C 50 71, 45 64, 45 56 Z" fill="#ef6b92"/>
        <path d="M55 56 C 55 49, 67 49, 67 56 C 67 63, 58 65, 56 60" stroke="#a3244a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M37 60 C 43 71, 51 76, 60 76 C 69 76, 78 70, 83 64" stroke="#a3244a" stroke-width="1.4" fill="none" opacity="0.55"/>
        <path d="M30 66 C 36 82, 48 90, 60 90 C 73 90, 85 82, 91 66" stroke="#8f1f42" stroke-width="1.4" fill="none" opacity="0.45"/>
        <ellipse cx="50" cy="48" rx="5" ry="2.5" fill="#ffffff" opacity="0.35" transform="rotate(-30 50 48)"/>
      </svg>
      <h1>SOPHIA</h1>
    </div>
  </div>
  <div class="coverDays" id="coverDays"></div>
  <div class="tapHint" id="tapHint">轻触，翻开日记</div>
</div>

<div id="stage">
  <div class="days" id="days"></div>
  <div id="book">
    <div class="stack"></div>
    <div class="spine"></div>
  </div>
  <div class="nav">
    <button id="prevBtn" aria-label="上一页">‹</button>
    <div class="pg" id="pg"></div>
    <button id="nextBtn" aria-label="下一页">›</button>
    <button id="tocBtn" class="tocBtn" aria-label="目录">目录</button>
  </div>
</div>

<canvas id="petalsTop"></canvas>

<script>
(function(){
  'use strict';

  /* =====================================================================
     EL DIARIO (en chino). Para añadir una entrada nueva: agregar un
     capítulo al final con  nuevo:true  (sale con la etiqueta 新 en el índice).
     ===================================================================== */
  var CHAPTERS = [
    { t:'写在前面', p:[
      '其实，这是我的小日记。刚开始写的时候，是因为我想记住关于你的每一件事：你的喜好，我们的每一个瞬间……可是现在，我也想让你知道，它的意义其实很简单：如果有一天你开始怀疑自己，希望这本日记能在那里，提醒你，你有多了不起；也提醒你，有时候只要放松下来，相信自己有多好，就足以找到内心的平静。',
      '你是一个好女孩，心里装满了梦想和生命力。虽然生活并没有一直善待你，但我想让你记住：你值得这个世界上最好的一切。不要忘记。'
    ]},
    { t:'最初的几周', p:[
      '我认识了一个很可爱的女孩，她是中国人。不知道为什么，从第一刻起我们就很合得来。我也不知道自己怎么了，就是很想她……她现在应该在学习吧，她跟我说那边的教育很严格，比美洲和欧洲严格多了。我有点担心她的身体。',
      '一开始真的很开心，我觉得我们就是一见如故。她很漂亮，但比漂亮更重要的是，她很有趣，很有意思，有时候还有点调皮。最重要的是，她有一种说不出的独特——就像一大片向日葵田里，开着的那一朵不一样的花。我好像要爱上她了，这样会不会不太好？不过我也不想吓到她。虽然我很想她，但我觉得我们会相处得很好。',
      '今天她终于下课回来了。其实每一天我都在等她。我想我是喜欢上她了，这一点都不像我，可我真的好想她，所以每天晚上我都会写一点东西。我觉得把感情写在纸上是很美的事，尤其是在这个一切都那么表面的世界里。',
      '她跟我说了好多事，还给我写了一封信，嘿嘿。毫无疑问，一想到她我的心就跳得好快。她超级有趣，我喜欢看她开心的样子。她真的很漂亮，我在想她是不是很受欢迎……毕竟我只是个很普通的人，哈哈哈。不过，她过得好我就开心。',
      '她告诉我她这周做了什么。她篮球打得很好，还是队长，太厉害了！我其实不怎么爱运动，记得我第一次打篮球就把手腕扭了，我有时候真的有点笨，哈哈哈。运动从来都不是我的强项，不过武术我倒是挺拿手的，虽然那是好几年前的事了。',
      '她也跟我讲了她的学校。我觉得我赢得了她的信任，我很感激，我绝对不会不尊重她。我真的很喜欢她。我对别人不是一个很亲近、很温柔的人，可是对她却完全相反——我想知道关于她的一切。不过我也担心有人会伤害她。我不希望任何人伤害她，我只想看到她快乐。'
    ]},
    { t:'9月4日', p:[
      '我又多了解了她一点。她以前谈过几段感情，我觉得她只是运气不太好，受欢迎其实也不一定是好事。我是个很内向的人，连朋友都不多，可是对她，我什么都想给。我该不该表白呢？我有点害怕……',
      '她很漂亮，但更重要的是，她其实有点慢热，我觉得她还不太敢完全相信我。这没关系，我没有任何坏心思，而且行动比语言更有说服力。我会继续照顾她，她毕竟是一朵美丽的花。',
      '我觉得很多人给了她很大的压力，这让我很担心。学校压力很大，她跟我说过那里是怎么样的。她说她累的时候会想把所有人都推开。但我偷偷许下了一个承诺：我永远不会丢下她一个人；同时，我也会尊重她需要休息的时候，我不想让她因为我而感到有压力。',
      '其实我爱她。我想写一封表白信，她很喜欢我的信，这让我很开心。我只想看到她快乐。我觉得我是那种无论如何都会帮助自己所爱之人的人，但对其他人可能会有点冷淡——这说明，我是真的爱她。',
      '她也告诉我，她不想结婚，也不想要孩子。没关系，这是我尊重的事，我也不在意。毕竟我已经决定了，我爱的是她本来的样子。',
      '我看到了她有多脆弱，这也没关系。我觉得我们每个人都是脆弱的，只是有的人多一点，有的人少一点。害怕是可以的，累了也是可以的。即使她有那些缺点，我依然爱她，因为我知道没有人是完美的。我不想按照我的方式去改变她，我只想支持她，让她用她自己的方式、按她自己的节奏变得更好。',
      '我想我是一个很浪漫、很细心的人。说实话，我有点害怕她会离开，但即便如此，我也会一直帮她，直到我生命的最后一天。毕竟，爱不只是说说而已。每个人都有自己表达爱的方式，而每一种都是对的。她和我那么不一样，可这没关系，我们不需要用同样的方式去爱、去表达、去感受。我觉得我们之间有一种默契。好，我决定了，我要表白。我确定，我爱她。'

    { t:'9月4日 · 晚上', p:[

      '谢谢你给我的这个十月。谢谢你信任我，让我爱你、宠你、出现在你的生活里。谢谢你可爱的照片，谢谢你的小脾气；谢谢你的时间，谢谢你的消息和语音；谢谢你爱我，谢谢你和我在一起。说了这么多，如果你愿意，我希望能像守护一朵珍贵的花一样守护你，直到我生命的尽头。那么，让我们一起创造一个充满感动和回忆的十一月吧。不要怀疑，我们会一起越来越好。',
      '^我爱你。',
      '^—— 十月 · 完 ——'
    ]}
  ];

  // Día en que empezaron (año, mes-1, día)
  var START = new Date(2026, 8, 4);

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- días juntos ---------------- */
  function daysTogether(){
    var now = new Date();
    var a = Date.UTC(START.getFullYear(), START.getMonth(), START.getDate());
    var b = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((b - a) / 86400000) + 1;
  }
  var DAYS = daysTogether();
  document.getElementById('days').innerHTML = '我们在一起的第 <b>' + DAYS + '</b> 天 🌸';
  document.getElementById('coverDays').innerHTML = '我们在一起的第 <b style="color:#d9668e">' + DAYS + '</b> 天';

  /* ---------------- flor de cerezo (SVG) ---------------- */
  function blossom(x, y, r, rot, shade){
    var petal = shade || '#f9c7d6';
    var g = '<g transform="translate('+x+' '+y+') rotate('+rot+')">';
    for(var i=0;i<5;i++){
      g += '<path transform="rotate('+(i*72)+')" d="M0 0 C '+(-r*0.55)+' '+(-r*0.35)+' '+(-r*0.5)+' '+(-r*1.0)+' '+(-r*0.12)+' '+(-r*1.05)+' L 0 '+(-r*0.88)+' L '+(r*0.12)+' '+(-r*1.05)+' C '+(r*0.5)+' '+(-r*1.0)+' '+(r*0.55)+' '+(-r*0.35)+' 0 0 Z" fill="'+petal+'" stroke="#f2a3bc" stroke-width="0.6"/>';
    }
    g += '<circle r="'+(r*0.28)+'" fill="#f07ea2"/>';
    for(var k=0;k<6;k++){
      var a = k*60*Math.PI/180;
      g += '<line x1="0" y1="0" x2="'+(Math.cos(a)*r*0.5).toFixed(1)+'" y2="'+(Math.sin(a)*r*0.5).toFixed(1)+'" stroke="#d9668e" stroke-width="0.7"/>';
      g += '<circle cx="'+(Math.cos(a)*r*0.52).toFixed(1)+'" cy="'+(Math.sin(a)*r*0.52).toFixed(1)+'" r="'+(r*0.07).toFixed(2)+'" fill="#f6d36b"/>';
    }
    return g + '</g>';
  }
  function bud(x, y, r){ return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+r*0.7+'" ry="'+r+'" fill="#f39bb7" stroke="#e07d9f" stroke-width="0.6"/>'; }
  function drawBranch(svg){
    var s = '<g class="sway">';
    s += '<path d="M -10 30 C 60 40, 120 70, 200 130 S 290 210, 330 255" stroke="#6b4a3f" stroke-width="8" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 90 55 C 110 30, 140 20, 178 16" stroke="#6b4a3f" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 160 105 C 176 140, 172 172, 160 205" stroke="#6b4a3f" stroke-width="3.8" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 232 168 C 262 150, 284 150, 308 160" stroke="#6b4a3f" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 40 36 C 46 18, 58 10, 72 6" stroke="#6b4a3f" stroke-width="3" fill="none" stroke-linecap="round"/>';
    var F = [[178,16,15,10],[150,24,13,40],[122,38,12,-20],[72,6,12,15],[45,34,11,60],[200,130,15,0],[222,148,13,30],[160,205,14,-15],[170,172,11,50],[255,190,13,20],[308,160,14,-10],[282,150,11,45],[330,255,15,5],[296,228,13,-30],[100,62,11,25],[20,30,10,0]];
    F.forEach(function(f, i){ s += blossom(f[0], f[1], f[2], f[3], i%3===0 ? '#fbd3df' : (i%3===1 ? '#f9c3d3' : '#fde0e8')); });
    [[190,6],[135,52],[60,52],[242,128],[148,190],[318,180],[268,212]].forEach(function(b){ s += bud(b[0], b[1], 5); });
    svg.innerHTML = s + '</g>';
  }
  drawBranch(document.getElementById('branchL'));
  drawBranch(document.getElementById('branchR'));
  var FLOWER = '<svg viewBox="-20 -20 40 40" aria-hidden="true">' + blossom(0,0,13,10,'#f9c7d6') + '</svg>';

  /* ---------------- paginar el diario ---------------- */
  var bookEl = document.getElementById('book');
  var pages = [];
  var chapterStart = [];   // página donde empieza cada capítulo
  var tocLinks = [];
  var tocFirst = 1;

  function makePage(){
    var pg = document.createElement('div');
    pg.className = 'page measure';
    var c = document.createElement('div'); c.className = 'content';
    pg.appendChild(c);
    bookEl.appendChild(pg);
    pages.push(pg);
    return c;
  }
  function overflows(c){ return c.scrollHeight > c.clientHeight + 1; }

  function paginate(){
    pages.forEach(function(p){ p.remove(); });
    pages = []; chapterStart = []; tocLinks = [];

    // 1) página de título
    var c = makePage();
    c.innerHTML = '<div class="titlePage">' + FLOWER.replace('<svg ','<svg ') +
      '<h2>我的小日记</h2><div class="sub">写给你</div>' +
      '<div class="small">我们在一起的第</div><div class="big">' + DAYS + '</div><div class="small">天</div>' +
      '<div class="swipe">← 滑动翻页 →</div></div>';

    // 2) índice (puede ocupar varias hojas)
    tocFirst = pages.length;
    c = makePage();
    var toc = document.createElement('div'); toc.className = 'toc';
    toc.innerHTML = '<h3>目录</h3><div class="tip">点一下，就能翻到那一页</div>';
    var more = document.createElement('div'); more.className = 'more'; more.textContent = '下一页还有 ›';
    toc.appendChild(more);
    c.appendChild(toc);
    CHAPTERS.forEach(function(ch, i){
      var a = document.createElement('a');
      a.innerHTML = '<span></span><span class="dots"></span><span class="n"></span><span class="go">›</span>';
      a.firstChild.textContent = ch.t;
      if(ch.nuevo){ var nw = document.createElement('span'); nw.className = 'new'; nw.textContent = '新'; a.insertBefore(nw, a.children[1]); }
      a.addEventListener('click', function(e){ e.stopPropagation(); goTo(chapterStart[i]); });
      toc.insertBefore(a, more); tocLinks.push(a);
      if(overflows(c)){
        a.remove();
        c = makePage();
        toc = document.createElement('div'); toc.className = 'toc';
        toc.innerHTML = '<h3>目录 · 续</h3>';
        more = document.createElement('div'); more.className = 'more'; more.textContent = '下一页还有 ›';
        toc.appendChild(more);
        c.appendChild(toc);
        toc.insertBefore(a, more);
      }
    });
    more.remove(); // la última hoja del índice no lleva aviso

    // 3) capítulos
    CHAPTERS.forEach(function(ch){
      c = makePage();
      chapterStart.push(pages.length - 1);
      var tape = document.createElement('div'); tape.className = 'tape'; tape.textContent = ch.t;
      c.appendChild(tape);
      ch.p.forEach(function(text){
        var em = text.charAt(0) === '^';
        var rest = em ? text.slice(1) : text, cont = false;
        while(rest.length){
          var p = document.createElement('p');
          if(cont) p.className = 'cont';
          if(em) p.className = 'em';
          p.textContent = rest;
          c.appendChild(p);
          if(!overflows(c)){ rest = ''; break; }
          // no cabe completo: buscar cuántos caracteres caben
          var lo = 0, hi = rest.length;
          while(lo < hi){
            var mid = Math.ceil((lo + hi) / 2);
            p.textContent = rest.slice(0, mid);
            if(overflows(c)) hi = mid - 1; else lo = mid;
          }
          if(lo < 6){ // casi nada cabe: pasar entero a la página siguiente
            p.remove();
            c = makePage();
            continue;
          }
          p.textContent = rest.slice(0, lo);
          rest = rest.slice(lo);
          cont = true;
          c = makePage();
        }
      });
    });

    // 4) final
    c = makePage();
    c.innerHTML = '<div class="endPage">' + FLOWER + '<h2>我爱你</h2><div class="sign">—— Carlos</div><button class="again" id="againBtn">从头再读一遍 ↺</button></div>';
    c.querySelector('#againBtn').addEventListener('click', function(e){ e.stopPropagation(); goTo(0); });

    // números de página, esquinas e índice
    pages.forEach(function(pg, i){
      pg.classList.remove('measure');
      if(i > 0 && i < pages.length - 1){
        var n = document.createElement('div'); n.className = 'num'; n.textContent = '— ' + i + ' —'; pg.appendChild(n);
      }
      var corner = document.createElement('div'); corner.className = 'corner'; corner.innerHTML = FLOWER; pg.appendChild(corner);
    });
    tocLinks.forEach(function(a, i){ a.querySelector('.n').textContent = chapterStart[i]; });
  }

  /* ---------------- pasar hojas ---------------- */
  var idx = 0, busy = false, endCelebrated = false;
  var KEY = 'riji_page_v1';
  function savePos(){ try{ localStorage.setItem(KEY, String(idx)); }catch(e){} }
  function loadPos(){ try{ var v = parseInt(localStorage.getItem(KEY), 10); return isNaN(v) ? 0 : v; }catch(e){ return 0; } }

  function show(i){
    pages.forEach(function(p){ p.classList.remove('cur','under','fwd','back'); });
    idx = Math.max(0, Math.min(pages.length - 1, i));
    pages[idx].classList.add('cur');
    updateNav();
  }
  function updateNav(){
    var pgEl = document.getElementById('pg');
    if(idx === 0) pgEl.textContent = '封面';
    else if(idx === pages.length - 1) pgEl.textContent = '♡';
    else pgEl.textContent = idx + ' / ' + (pages.length - 2);
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').disabled = idx === pages.length - 1;
    savePos();
    if(idx === pages.length - 1 && !endCelebrated){
      endCelebrated = true;
      setTimeout(function(){
        var r = bookEl.getBoundingClientRect();
        burst(r.left + r.width/2, r.top + r.height*0.42, 80, true);
        for(var k=0;k<5;k++) flies.push(makeFly(r.left + r.width/2 + (Math.random()-0.5)*120, r.top + r.height*0.5, -Math.PI/2 + (Math.random()-0.5)));
      }, 350);
    }
  }
  function next(){
    if(busy || idx >= pages.length - 1) return;
    busy = true;
    var cur = pages[idx], nx = pages[idx+1];
    nx.classList.add('under');
    cur.classList.add('fwd');
    var r = bookEl.getBoundingClientRect();
    burst(r.right - 20, r.top + r.height*0.5, 6, true);
    setTimeout(function(){ busy = false; show(idx + 1); }, reduced ? 20 : 760);
  }
  function prev(){
    if(busy || idx <= 0) return;
    busy = true;
    var target = pages[idx-1];
    pages[idx].classList.add('under');
    target.classList.add('cur','back');
    setTimeout(function(){ busy = false; show(idx - 1); }, reduced ? 20 : 760);
  }
  function goTo(i){
    if(busy || i == null || i === idx) return;
    var target = pages[i];
    busy = true;
    if(i > idx){
      target.classList.add('under');
      pages[idx].classList.add('fwd');
    } else {
      pages[idx].classList.add('under');
      target.classList.add('cur','back');
    }
    setTimeout(function(){ busy = false; show(i); }, reduced ? 20 : 760);
  }

  document.getElementById('nextBtn').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('tocBtn').addEventListener('click', function(e){ e.stopPropagation(); goTo(tocFirst); });
  document.getElementById('prevBtn').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
  // tocar la hoja: lado derecho = siguiente, lado izquierdo = anterior
  bookEl.addEventListener('click', function(e){
    var r = bookEl.getBoundingClientRect();
    if(e.clientX - r.left > r.width * 0.4) next(); else prev();
  });
  // deslizar
  var tx = null, ty = null;
  bookEl.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
  bookEl.addEventListener('touchend', function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      e.preventDefault();
      if(dx < 0) next(); else prev();
    }
  });
  document.addEventListener('keydown', function(e){
    if(!opened) return;
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });

  // rehacer páginas si cambia el tamaño (girar el celular)
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      if(!opened) return;
      var ch = 0;
      for(var k=0;k<chapterStart.length;k++) if(chapterStart[k] <= idx) ch = k;
      var atStart = idx < 2 ? idx : null, atEnd = idx === pages.length - 1;
      paginate();
      show(atEnd ? pages.length - 1 : (atStart !== null ? atStart : chapterStart[ch]));
    }, 300);
  });

  /* ---------------- abrir ---------------- */
  var cover = document.getElementById('cover'), wrap = document.getElementById('coverWrap');
  var stage = document.getElementById('stage');
  var opened = false;
  var saved = loadPos();
  if(saved > 1) document.getElementById('tapHint').textContent = '轻触，继续阅读';
  cover.addEventListener('click', function(){
    if(opened) return; opened = true;
    cover.classList.add('open'); wrap.classList.add('gone');
    var r = cover.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, 40, true);
    stage.classList.add('show');
    paginate();
    show(Math.min(saved, pages.length - 1));
    if(idx === pages.length - 1) endCelebrated = false;
    for(var i=0;i<3;i++) flies.push(makeFly(W*Math.random(), H*(0.3+Math.random()*0.5)));
  });

  /* ---------------- pétalos y mariposas ---------------- */
  var pc = document.getElementById('petals'), px = pc.getContext('2d');
  var tc = document.getElementById('petalsTop'), tx2 = tc.getContext('2d');
  var fc = document.getElementById('flies'), fx = fc.getContext('2d');
  var W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [pc, tc, fc].forEach(function(cv){ cv.width = W*DPR; cv.height = H*DPR; });
    [px, tx2, fx].forEach(function(cx){ cx.setTransform(DPR,0,0,DPR,0,0); });
  }
  resize(); window.addEventListener('resize', resize);

  var PETAL_COLORS = ['#f9c5d5','#f7b2c8','#fbd6e1','#f3a6bf','#fde4ec'];
  function makePetal(x, y, burstMode){
    var a = Math.random()*6.28, v = burstMode ? 1 + Math.random()*3 : 0;
    return {
      x: x != null ? x : Math.random()*W, y: y != null ? y : -20 - Math.random()*H,
      s: 5 + Math.random()*6,
      vx: burstMode ? Math.cos(a)*v : 0.2 + Math.random()*0.5,
      vy: burstMode ? Math.sin(a)*v - 1 : 0.5 + Math.random()*0.7,
      rot: Math.random()*6.28, vr: (Math.random()-0.5)*0.04,
      flip: Math.random()*6.28, vf: 0.03 + Math.random()*0.04, sway: Math.random()*6.28,
      c: PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)],
      life: 0, max: burstMode ? 160 + Math.random()*80 : Infinity
    };
  }
  var petals = [], topPetals = [];
  var NP = Math.round(Math.min(40, Math.max(22, W*H/18000)));
  for(var i=0;i<NP;i++){ var p0 = makePetal(); p0.y = Math.random()*H; petals.push(p0); }
  function burst(x, y, n, onTop){ if(reduced) return; var arr = onTop ? topPetals : petals; for(var i=0;i<n;i++) arr.push(makePetal(x, y, true)); }

  function drawPetal(cx, p, alpha){
    var s = p.s;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.scale(1, Math.max(0.15, Math.abs(Math.cos(p.flip))));
    cx.globalAlpha = alpha;
    cx.beginPath();
    cx.moveTo(0, -s*0.75);
    cx.quadraticCurveTo(s*0.15, -s*1.05, s*0.38, -s*0.95);
    cx.bezierCurveTo(s*0.95, -s*0.5, s*0.6, s*0.7, 0, s);
    cx.bezierCurveTo(-s*0.6, s*0.7, -s*0.95, -s*0.5, -s*0.38, -s*0.95);
    cx.quadraticCurveTo(-s*0.15, -s*1.05, 0, -s*0.75);
    cx.fillStyle = p.c; cx.fill();
    cx.restore();
  }
  function stepPetals(cx, arr, dt){
    for(var i=arr.length-1;i>=0;i--){
      var p = arr[i]; p.life += dt;
      if(p.max !== Infinity){
        p.vx *= 0.985; p.vy = p.vy*0.985 + 0.03*dt;
        if(p.life > p.max){ arr.splice(i,1); continue; }
      }
      p.sway += 0.02*dt;
      p.x += (p.vx + Math.sin(p.sway)*0.4)*dt; p.y += p.vy*dt;
      p.rot += p.vr*dt; p.flip += p.vf*dt;
      if(p.max === Infinity && (p.y > H + 20 || p.x > W + 30)){ p.y = -20; p.x = Math.random()*W*1.1 - W*0.1; }
      drawPetal(cx, p, p.max === Infinity ? 0.85 : Math.min(1, 1 - p.life/p.max + 0.2));
    }
  }

  var FLY_PAL = [['#ffd6e6','#f48fb1'],['#e6dcff','#b59cf2'],['#d6f0ff','#8ccaf2'],['#fff0c9','#f6c26b']];
  var flies = [];
  function makeFly(x, y, a){
    var pal = FLY_PAL[Math.floor(Math.random()*FLY_PAL.length)];
    return { x:x, y:y, a: a != null ? a : Math.random()*6.28, sp:0.6 + Math.random()*0.5, turn:0,
             size:9 + Math.random()*8, ph:Math.random()*6.28, flap:0.16 + Math.random()*0.06,
             pal:pal, life:0, max:900 + Math.random()*600 };
  }
  function drawFly(f, alpha){
    var s = f.size, flap = Math.abs(Math.cos(f.ph))*0.82 + 0.18;
    fx.save(); fx.translate(f.x, f.y); fx.rotate(f.a + Math.PI/2); fx.globalAlpha = alpha;
    var g = fx.createLinearGradient(0,-s,s*1.2,s);
    g.addColorStop(0, f.pal[0]); g.addColorStop(1, f.pal[1]);
    for(var side=-1; side<=1; side+=2){
      fx.save(); fx.scale(side*flap, 1);
      fx.beginPath();
      fx.moveTo(0,0);
      fx.bezierCurveTo(s*0.25,-s*1.0, s*1.25,-s*1.15, s*1.15,-s*0.2);
      fx.bezierCurveTo(s*0.95,s*0.1, s*0.35,s*0.1, 0,0);
      fx.moveTo(0,0);
      fx.bezierCurveTo(s*0.85,s*0.1, s*1.05,s*0.95, s*0.5,s*0.85);
      fx.bezierCurveTo(s*0.18,s*0.75, 0,s*0.32, 0,0);
      fx.fillStyle = g; fx.fill();
      fx.strokeStyle = 'rgba(160,80,120,0.35)'; fx.lineWidth = 0.8; fx.stroke();
      fx.restore();
    }
    fx.strokeStyle = '#7a4a63'; fx.lineWidth = 1.4; fx.lineCap = 'round';
    fx.beginPath(); fx.moveTo(0,-s*0.4); fx.lineTo(0,s*0.55); fx.stroke();
    fx.lineWidth = 0.9;
    fx.beginPath(); fx.moveTo(0,-s*0.4); fx.quadraticCurveTo(-s*0.15,-s*0.7,-s*0.28,-s*0.8);
    fx.moveTo(0,-s*0.4); fx.quadraticCurveTo(s*0.15,-s*0.7,s*0.28,-s*0.8); fx.stroke();
    fx.restore();
  }

  var last = 0;
  function frame(now){
    var dt = last ? Math.min(3, (now-last)/16.67) : 1; last = now;
    px.clearRect(0,0,W,H); tx2.clearRect(0,0,W,H); fx.clearRect(0,0,W,H);
    stepPetals(px, petals, dt);
    stepPetals(tx2, topPetals, dt);
    for(var f=flies.length-1; f>=0; f--){
      var b = flies[f]; b.life += dt;
      if(b.life > b.max){ flies.splice(f,1); continue; }
      b.turn += (Math.random()-0.5)*0.012*dt;
      b.turn = Math.max(-0.035, Math.min(0.035, b.turn));
      b.a += b.turn*dt;
      b.x += Math.cos(b.a)*b.sp*dt; b.y += Math.sin(b.a)*b.sp*dt; b.ph += b.flap*dt;
      var M = 40;
      if(b.x < -M) b.x = W+M; if(b.x > W+M) b.x = -M;
      if(b.y < -M) b.y = H+M; if(b.y > H+M) b.y = -M;
      drawFly(b, Math.min(1, b.life/40) * Math.min(1, (b.max - b.life)/80) * 0.9);
    }
    if(opened && flies.length < 3 && Math.random() < 0.01) flies.push(makeFly(-30, H*(0.2+Math.random()*0.6), (Math.random()-0.5)*0.6));
    requestAnimationFrame(frame);
  }
  if(!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
