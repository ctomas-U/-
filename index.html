<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbe4ec">
<title>我的小日记 🌸</title>
<style>
  :root{
    --sky1:#fde9f0;
    --sky2:#f8dbe7;
    --sky3:#ece2f6;
    --ink:#4a3346;
    --ink-soft:#7d6178;
    --paper:#fffaf6;
    --sakura:#f4a7c0;
    --sakura-deep:#d9668e;
    --branch:#6b4a3f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,255,255,0.7), transparent 70%),
      radial-gradient(ellipse 60% 40% at 85% 85%, rgba(214,190,240,0.45), transparent 70%),
      linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 50%, var(--sky3) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Kaiti SC','STKaiti','KaiTi','Noto Serif CJK SC','Noto Serif SC','Songti SC','SimSun',serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body.locked{ overflow:hidden; height:100vh; }

  .branch{ position:fixed; z-index:1; pointer-events:none; }
  .branch.left{ top:-10px; left:-14px; width:min(58vw,360px); }
  .branch.right{ top:18vh; right:-16px; width:min(42vw,250px); transform:scaleX(-1); opacity:0.9; }
  .branch svg{ width:100%; height:auto; display:block; overflow:visible; }
  .sway{ transform-origin:0 0; animation:sway 7s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(-0.8deg); } to{ transform:rotate(1.2deg); } }

  #petals{ position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #flies{ position:fixed; inset:0; width:100%; height:100%; z-index:6; pointer-events:none; }

  /* barra de progreso */
  #progress{
    position:fixed; top:0; left:0; height:3px; width:0; z-index:7;
    background:linear-gradient(90deg, #f7bfd1, var(--sakura-deep));
    box-shadow:0 0 8px rgba(217,102,142,0.5);
    transition:width 0.2s linear;
  }

  /* ---------- portada ---------- */
  #coverWrap{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    perspective:1600px;
    transition:opacity 1.2s ease 1s;
  }
  #coverWrap.gone{ opacity:0; pointer-events:none; }
  .cover{
    position:relative; cursor:pointer;
    width:min(76vw,320px); aspect-ratio:3/4.1;
    border-radius:8px 18px 18px 8px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.35), transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px),
      linear-gradient(140deg, #f6b9cc, #e88aa9 60%, #d9708f);
    box-shadow:0 30px 60px rgba(150,60,100,0.35), inset 8px 0 0 rgba(0,0,0,0.08), inset 0 0 40px rgba(120,30,70,0.18);
    transform-origin:left center;
    transition:transform 1.6s cubic-bezier(.6,.05,.25,1);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .cover.open{ transform:rotateY(-165deg); }
  .cover .ribbon{
    position:absolute; top:-6px; right:22%; width:18px; height:calc(100% + 34px);
    background:linear-gradient(90deg,#c84f78,#e47b9f,#c84f78);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 94%,0 100%);
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .cover .label{
    position:relative; margin-right:12%;
    background:rgba(255,250,246,0.92); color:var(--ink);
    border-radius:12px; padding:1.3rem 1.4rem 1.1rem;
    box-shadow:0 6px 18px rgba(120,40,80,0.18);
  }
  .cover .label h1{ font-weight:400; font-size:clamp(1.6rem,7vw,2rem); letter-spacing:0.25em; padding-left:0.25em; }
  .cover .label p{ margin-top:0.5rem; font-size:0.9rem; letter-spacing:0.3em; color:var(--sakura-deep); }
  .cover .flower-badge{ position:absolute; width:74px; left:14%; bottom:12%; opacity:0.95; }
  .tapHint{
    margin-top:2.6rem; color:var(--ink-soft); font-size:0.95rem; letter-spacing:0.25em;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }

  /* ---------- diario ---------- */
  .book{
    position:relative; z-index:4;
    max-width:36rem; margin:0 auto;
    padding:max(14vh,5.5rem) 16px max(10vh,4rem);
    opacity:0; transform:translateY(24px);
    transition:opacity 1.6s ease, transform 1.6s ease;
  }
  .book.show{ opacity:1; transform:none; }
  .chapter{
    position:relative;
    background:
      radial-gradient(circle at 100% 0%, rgba(248,200,216,0.25), transparent 40%),
      linear-gradient(180deg, #fffdfb, var(--paper));
    border-radius:20px;
    padding:2.6rem 1.5rem 1.8rem;
    margin-bottom:2.4rem;
    box-shadow:0 18px 40px rgba(170,90,130,0.16), 0 0 0 1px rgba(232,180,200,0.35);
    opacity:0; transform:translateY(16px);
    transition:opacity 1.3s ease, transform 1.3s ease;
  }
  .chapter.in{ opacity:1; transform:none; }
  .tape{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-2deg);
    background:repeating-linear-gradient(90deg, rgba(247,190,209,0.92) 0 9px, rgba(251,214,225,0.92) 9px 18px);
    color:#7a3a57; padding:0.35em 1.2em; font-size:1rem; letter-spacing:0.12em;
    white-space:nowrap; border-radius:3px;
    box-shadow:0 2px 6px rgba(160,80,110,0.15);
  }
  .chapter p{
    font-size:clamp(1.06rem,4.3vw,1.2rem);
    line-height:2.05; letter-spacing:0.04em; color:var(--ink);
    margin-bottom:1.3rem; text-indent:2em;
  }
  .chapter p:last-child{ margin-bottom:0; }
  .chapter .corner{ position:absolute; width:46px; right:12px; bottom:10px; opacity:0.55; }
  .divider{ text-align:center; margin:-0.6rem 0 1.8rem; }
  .divider svg{ width:34px; height:34px; opacity:0.7; }

  .ending{
    text-align:center; padding:2.4rem 1rem 1rem;
    opacity:0; transform:translateY(16px);
    transition:opacity 1.6s ease, transform 1.6s ease;
  }
  .ending.in{ opacity:1; transform:none; }
  .ending h2{
    font-weight:400; font-size:clamp(2.4rem,11vw,3.4rem); letter-spacing:0.2em; padding-left:0.2em;
    color:var(--sakura-deep);
    text-shadow:0 0 30px rgba(255,255,255,0.9), 0 4px 18px rgba(217,102,142,0.35);
  }
  .ending .sign{ margin-top:1rem; font-size:1.4rem; color:var(--ink-soft); letter-spacing:0.08em; }
  .ending .hint{ margin-top:2.4rem; font-size:0.85rem; letter-spacing:0.2em; color:rgba(125,97,120,0.6); }

  @media (prefers-reduced-motion: reduce){
    .sway, .tapHint{ animation:none; }
    .cover, .book, .chapter, .ending{ transition:none !important; }
    #petals, #flies{ display:none; }
  }
</style>
</head>
<body class="locked">

<div class="branch left" aria-hidden="true"><svg id="branchL" viewBox="0 0 330 270"></svg></div>
<div class="branch right" aria-hidden="true"><svg id="branchR" viewBox="0 0 330 270"></svg></div>
<canvas id="petals"></canvas>
<canvas id="flies"></canvas>
<div id="progress"></div>

<div id="coverWrap">
  <div class="cover" id="cover" role="button" aria-label="打开日记">
    <div class="ribbon"></div>
    <svg class="flower-badge" id="badge" viewBox="-40 -40 80 80" aria-hidden="true"></svg>
    <div class="label">
      <h1>我的小日记</h1>
      <p>写给你</p>
    </div>
  </div>
  <div class="tapHint">轻触，翻开日记</div>
</div>

<main class="book" id="book"></main>

<script>
(function(){
  'use strict';

  /* =====================================================================
     EL DIARIO (en chino). Cada capítulo: título + párrafos.
     ===================================================================== */
  var CHAPTERS = [
    { t:'写在前面', p:[
      '其实，这是我的小日记。刚开始写的时候，是因为我想记住关于你的每一件事：你的喜好，我们的每一个瞬间……可是现在，我也想让你知道，它的意义其实很简单：如果有一天你开始怀疑自己，希望这本日记能在那里，提醒你，你有多了不起；也提醒你，有时候只要放松下来，相信自己有多好，就足以找到内心的平静。',
      '你是一个好女孩，心里装满了梦想和生命力。虽然生活并没有一直善待你，但我想让你记住：你值得这个世界上最好的一切。不要忘记。'
    ]},
    { t:'最初的几周', p:[
      '我认识了一个很可爱的女孩，她是中国人。不知道为什么，从第一刻起我们就很合得来。我也不知道自己怎么了，就是很想她……她现在应该在学习吧，她跟我说那边的教育很严格，比美洲和欧洲严格多了。我有点担心她的身体。',
      '一开始真的很开心，我觉得我们就是一见如故。她很漂亮，但比漂亮更重要的是，她很有趣，很有意思，有时候还有点调皮。最重要的是，她有一种说不出的独特——就像一大片向日葵田里，开着的那一朵不一样的花。我好像要爱上她了，这样会不会不太好？不过我也不想吓到她。虽然我很想她，但我觉得我们会相处得很好。',
      '今天她终于下课回来了。其实每一天我都在等她。我想我是喜欢上她了，这一点都不像我，可我真的好想她，所以每天晚上我都会写一点东西。我觉得把感情写在纸上是很美的事，尤其是在这个一切都那么表面的世界里。',
      '她跟我说了好多事，还给我写了一封信，嘿嘿。毫无疑问，一想到她我的心就跳得好快。她超级有趣，我喜欢看她开心的样子。她真的很漂亮，我在想她是不是很受欢迎……毕竟我只是个很普通的人，哈哈哈。不过，她过得好我就开心。',
      '她告诉我她这周做了什么。她篮球打得很好，还是队长，太厉害了！我其实不怎么爱运动，记得我第一次打篮球就把手腕扭了，我有时候真的有点笨，哈哈哈。运动从来都不是我的强项，不过武术我倒是挺拿手的，虽然那是好几年前的事了。',
      '她也跟我讲了她的学校。我觉得我赢得了她的信任，我很感激，我绝对不会不尊重她。我真的很喜欢她。我对别人不是一个很亲近、很温柔的人，可是对她却完全相反——我想知道关于她的一切。不过我也担心有人会伤害她。我不希望任何人伤害她，我只想看到她快乐。'
    ]},
    { t:'9月4日', p:[
      '我又多了解了她一点。她以前谈过几段感情，我觉得她只是运气不太好，受欢迎其实也不一定是好事。我是个很内向的人，连朋友都不多，可是对她，我什么都想给。我该不该表白呢？我有点害怕……',
      '她很漂亮，但更重要的是，她其实有点慢热，我觉得她还不太敢完全相信我。这没关系，我没有任何坏心思，而且行动比语言更有说服力。我会继续照顾她，她毕竟是一朵美丽的花。',
      '我觉得很多人给了她很大的压力，这让我很担心。学校压力很大，她跟我说过那里是怎么样的。她说她累的时候会想把所有人都推开。但我偷偷许下了一个承诺：我永远不会丢下她一个人；同时，我也会尊重她需要休息的时候，我不想让她因为我而感到有压力。',
      '其实我爱她。我想写一封表白信，她很喜欢我的信，这让我很开心。我只想看到她快乐。我觉得我是那种无论如何都会帮助自己所爱之人的人，但对其他人可能会有点冷淡——这说明，我是真的爱她。',
      '她也告诉我，她不想结婚，也不想要孩子。没关系，这是我尊重的事，我也不在意。毕竟我已经决定了，我爱的是她本来的样子。',
      '我看到了她有多脆弱，这也没关系。我觉得我们每个人都是脆弱的，只是有的人多一点，有的人少一点。害怕是可以的，累了也是可以的。即使她有那些缺点，我依然爱她，因为我知道没有人是完美的。我不想按照我的方式去改变她，我只想支持她，让她用她自己的方式、按她自己的节奏变得更好。',
      '我想我是一个很浪漫、很细心的人。说实话，我有点害怕她会离开，但即便如此，我也会一直帮她，直到我生命的最后一天。毕竟，爱不只是说说而已。每个人都有自己表达爱的方式，而每一种都是对的。她和我那么不一样，可这没关系，我们不需要用同样的方式去爱、去表达、去感受。我觉得我们之间有一种默契。好，我决定了，我要表白。我确定，我爱她。'
    ]},
    { t:'9月4日 · 晚上', p:[
      '今天我写好了表白信，好紧张，嘿嘿。其实我觉得我们已经很亲近了，但紧张也是正常的吧。我觉得我是一个很会表达的人。好吧，时间会告诉我们这段感情会怎样。我过几分钟就把它发出去。',
      '现在我有女朋友了！我觉得我太厉害了，刚才在房间里狠狠地跳了一下，还好家里只有我一个人。我正式有了一个超级棒的女朋友。不过我有时候觉得她心里有很多不安。她跟我说，永远不要离开她，因为大人们有时候会不告而别。我绝对不是那样的人。如果可以的话，我想永远守护这朵美丽的玫瑰。',
      '如果有一天你读到这里：我爱你。'
    ]},
    { t:'第一个月 · 10月4日', p:[
      '今天是10月4日。发生了好多事情，有好的时候，也有不好的时候；有开心的时刻，也有难过的时刻。但我很确定，我想一直和她在一起。她说自己是个负担，可她是我爱的人，怎么可能是负担呢？我们是那么不同，而这其实是好事，毕竟每个人都是一个不一样的宇宙。',
      '我很担心她的身体，啊，真想现在就飞过去照顾她……为什么我不是中国人呢！不过，凡事都有它的道理吧。',
      '我们的感情很稳固，它不建立在表面上，而是建立在信任上。我信任她，她也信任我。我们沟通得很好，虽然有时候聊得不多，但我了解她，这没关系。她小小的肩膀上扛着很多压力，这一次我会帮她。我想让她知道，我不想给她任何压力，我只希望她做她自己，无论怎样。毕竟，我爱的就是她本来的样子。',
      '有时候我看她没什么精神，我猜大概是因为她太能睡了，像只熊猫一样。我想象她睡着的时候一定很可爱，虽然我知道她其实很调皮，哈哈哈。她也很容易生气，可我一点都不介意，只希望你能好好休息。',
      '你现在应该在学校吧。今天我感觉你不太想去上学。请再坚持一下，在我眼里，你是一个非常坚强、非常聪明的女孩。今天加油，我的爱。其实我正在准备下一个惊喜，希望能让你开心一点。我会为你祈祷，希望你快点好起来，也希望你好好吃饭。',
      '我也送了她很多小礼物。说到底，我不期待任何回报，一个笑容就足够了。我很高兴她开心，很高兴我的猫能陪着她，我的项链能陪着她，那只水豚能待在她家里。其实我唯一的目的，就是让她知道：有一个人一直在支持她，给她力量。',
      '还好她放假的时候好好休息了一下，还和表哥出去玩了。我很高兴她能出去散散心。等我去她的城市的时候，就轮到我带她出去玩了，哈哈哈。拜托你，我的爱，好好玩，好好休息，我只求这个。',
      '她也说过我和别人有什么不一样，我很感激。毕竟我也有自己的问题，有时候也不成熟，我也不完美。但我很高兴自己一直好好对待她，这让我很开心。她总说自己没为我做过什么，可其实她让我变成了更好的人。最重要的是，和她在一起我觉得很自在。',
      '当然我有时也会担心，这很正常，毕竟没有一段感情是完美的。会有不好的时候、难过的时候，也许会吵架，也许某一天她会想把我推开。但我了解她。如果我在她身边，我会抱抱她，提醒她她有多特别、多了不起。',
      '她不需要是最漂亮的、最聪明的、最细心的，或者全世界最成熟的女孩，才算完美。她只需要做她自己。而且，她的笑容是所有笑容里最美的。她真的很了不起，也非常坚强——坚强得过头了，我怕这一切会让她撑不住。所以我得做好准备。因为我知道，你现在正在读这些字。而你的男朋友是那么厉害（开玩笑的），我已经有计划了。',
      '等那一刻到来的时候，别忘了你有多了不起。最重要的是，永远不要觉得自己是个负担。脆弱、需要空间、有时候不是最有活力的那个女孩，或者只是想休息一下——这些都没有错。这让你成为一个真实的人。',
      '我向生命发誓：在我眼里，你从来都不是负担。即使你的脑海里有另一个声音，即使你看自己的方式不一样，即使你只看到自己的不完美、觉得一切都很沉重——让我和你一起分担吧。现在我离你很远，但我真的很爱你，无论顺境还是逆境，都想陪在你身边。当你累了，我只希望你能靠在我身上，好好睡一觉。',
      '在我眼里，你是一只正在学飞的美丽蝴蝶。你还年轻，还在学习，还在认识这个世界。我在这世上唯一的愿望，就是有一天你会发现自己有多了不起。',
      '我知道大家都对你有很高的期望——你的老师、你的朋友、你的家人，所有人都把期待放在你身上，这让你喘不过气，也让你筋疲力尽。但我希望你把这件事放在心里：在这个世界上，在大洋的另一边，此时此刻，有一个男孩，他唯一的请求就是你能快乐、能好好休息。',
      '永远不要忘记，你在这一生中的任务，就是快乐，就是拥有平静；去追逐你的梦想，实现你的目标，做你自己。最重要的是——要快乐。相信我，这就是我唯一的梦想和请求。请好好吃饭，照顾好自己。你的情绪和你的担忧，是这个世界上最重要的事。',
      '去相信那些爱你的人，因为真正爱你的人，只会希望你幸福。没有人是完美的。我们都可能自私、烦人、生气、冷漠、无所谓；我们都有不安，都有各自的问题。即使知道这一切，即使见过你的很多面，从认识你开始每时每刻都陪着你，我唯一能对你说的是：我感谢生命让我拥有你。'
    ]},
    { t:'第二个月', p:[
      '昨天我们才刚刚从分开的难过里走出来。其实我很担心。我知道，当你的心累到极限的时候，你保护自己的方式就是变得冷淡。自从我有了微信，我觉得我们更亲近了。不知道为什么，我感觉你更有安全感了，你也更愿意表达了；其实你也变得更温柔了，但我敢肯定你自己没有发现。',
      '你爱人的方式很美。你不是一个特别浪漫的女孩，这没关系，你用你自己的方式表达你的关心、你的在乎和你的爱，这样就很好。这个时候你应该在睡觉吧，今天你心情不错。其实我不会写太多，不然等你读的时候就太长了，但我会写下重要的东西：我的想法、我的感受，还有最重要的——你对我来说是谁。'
    ]},
    { t:'十月 · 第一周', p:[
      '最近她心情很好。我很喜欢和你聊天，尤其是上学的日子；我喜欢我们分享每天的点点滴滴。这周你说了很美的话，你正在用你的方式表达你的爱。你有点调皮，但看到你开心我就很高兴。',
      '这周我只是许下了几个承诺。我们都了解彼此：没有一段感情是完美的，我相信以后还会有磕磕绊绊，会有疏远和难过的日子。每次想你的时候，我就看看夜空里的星星，或者窗外的月亮。我相信你也像它们一样美好，总有一天，你会比任何人都闪耀。只要相信自己，你会做成很了不起的事。你很聪明、很努力，也很有好胜心，你一定会做到的。',
      '不过，我也想照顾好你的心。什么都要做到最好，这些都压在你小小的肩膀上，但现在你不再是一个人了。当你生气的时候、当你的情绪到了极限，或者只是压力很大、很低落的时候，你会把我推开，我知道。可是我不会走：我答应过要陪着你，永远不放开你的小手，我会做到的。',
      '好在你现在很好，这让我很开心：你心情不错，会在上课时给我发语音，你更专注了，我也看到你更愿意表达了，这让我很幸福。我唯一的请求，是希望你能在心里找到平静，放下那些害怕。'
    ]},
    { t:'第二周', p:[
      '最近我慢慢习惯了微信。它和我以前用的完全不一样，但真的很厉害，是一个超大的应用生态，我很好奇它背后的工程技术是怎么做的。我还学会了给你点外卖，我会给你送一些甜点，不过我对这些很挑剔，哈哈，而且我还不太熟悉怎么用。',
      '今天早上你有点生气：上课让你压力很大，你又睡得太少，再加上你有点调皮，所以就容易生气。嗯，我很担心，我会努力劝你多休息。我很喜欢你给我发语音、发照片，告诉我你在做什么；我对你的世界很感兴趣，我对你很感兴趣。有时候，我很容易就想你了。这个时候你在睡觉吧，希望你睡个好觉。',
      '我还发现，对你，我没有底线：我不会生气，不会累，也不会烦，我总是牵挂着你。也许几年以后我不在你身边了，但我真的希望能在你心里留下一束火光。我相信总有一天，你会成为一个很了不起的女人。你很坚强，比你以为的更坚强，也比你以为的更温柔；最重要的是，你也懂得爱，只是用你自己的方式。'
    ]},
    { t:'现在', p:[
      '最近这些天我们过得很好。我用美食宠着她，这样很好，毕竟她值得。你承受了那么多，也哭了很多次，这真的很让人佩服。说真的，你很了不起，也很坚强。有时候我能察觉到你的害怕、你的不安和你的烦恼。相信我，我会支持你，直到生命的尽头。毕竟，谁知道明天会发生什么呢。',
      '你很聪明，在课堂上也很优秀。其实在数学、化学、生物和物理这些基础科目上，你比我聪明多了，我非常确定；我其实只擅长科技。我很喜欢和你在一起，和你分享我的一天，你也是我生命的一部分，你不是一个过客。我想一直留住你，可是未来是不确定的。说到底，爱是一场赌注：我们可能会有一个美好的结局，也可能结局没那么美好。可最后，能书写我们梦想的人，只有我们自己，只有我们。相信我，你是一个非常勇敢的姑娘。我相信有一天你回头看的时候，也许我已经不在了，但你会发现自己有多美、多勇敢、多了不起。',
      '有时候你说你不会爱人，可其实你懂得爱。你对我说过很美的话，夸过我；你给了我温柔，给了我善良，给了我支持，给了我牵挂，也把你的一部分给了我，我会用整颗心去珍藏。这一切，就是你：一个很漂亮、很有魅力的女学生；一个好胜心很强、很聪明，也很调皮的女孩，哈哈；有趣、充满活力、充满梦想、性格很强；一个很爱骂人的女孩，但心里也有善良和爱；一个充满害怕，也充满梦想的女孩；一个脆弱，也很坚强的女孩；一个会怀疑自己，却知道自己想要什么、每天都为了目标努力学习的女孩；一个说自己不够聪明，可在我眼里却非常聪明的女孩；一个温柔、美丽、可爱、善良的女孩；有时生气，有时难过，有时开心；心里装满了梦想、生命、目标和憧憬；一个有着美丽的笑容、美丽的眼睛、美丽的眼睑和美丽身姿的女孩。也许有时候你会忘记这些，但请不要忘记：也许你不是一直都这样觉得，但你现在是，将来也会是，一个了不起的女人。',
      '我不知道未来会怎样。其实我好想你。今天你情绪崩溃了，你总是想把我推开，但我会一直留在你身边，直到你厌倦我为止，因为我真的爱你。我不知道这段感情会带我们去哪里，但相信我，等那一天到来，我一定会去找你。请好好吃饭，照顾好自己。你还年轻，控制不住自己的情绪和想法是很正常的，但我相信你会继续成长，继续学习，会改变，也会做成很多事。',
      '有些事情你也许会失败、会犯错；有时候你也许会感到害怕、恐惧、焦虑或不安，但我想让你知道，我的每一部分都会尽全力，轻轻推你一把，提醒你你有多了不起。我想你。其实你是我生命中的一部分，很美的一部分，所以请不要忘记这一切。这封信并不完美，离完美还差得很远，但要把一件事做好，本来就不需要完美。说了这么多，等你读到这里的时候，我想给你一个拥抱，在你额头上轻轻一吻，还有，最重要的是——'
    ]}
  ];

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  /* ---------------- flor de cerezo (SVG) ---------------- */
  function blossom(x, y, r, rot, shade){
    var petal = shade || '#f9c7d6';
    var g = '<g transform="translate('+x+' '+y+') rotate('+rot+')">';
    for(var i=0;i<5;i++){
      g += '<path transform="rotate('+(i*72)+')" d="M0 0 C '+(-r*0.55)+' '+(-r*0.35)+' '+(-r*0.5)+' '+(-r*1.0)+' '+(-r*0.12)+' '+(-r*1.05)+' L 0 '+(-r*0.88)+' L '+(r*0.12)+' '+(-r*1.05)+' C '+(r*0.5)+' '+(-r*1.0)+' '+(r*0.55)+' '+(-r*0.35)+' 0 0 Z" fill="'+petal+'" stroke="#f2a3bc" stroke-width="0.6"/>';
    }
    g += '<circle r="'+(r*0.28)+'" fill="#f07ea2"/>';
    for(var k=0;k<6;k++){
      var a = k*60*Math.PI/180;
      g += '<line x1="0" y1="0" x2="'+(Math.cos(a)*r*0.5).toFixed(1)+'" y2="'+(Math.sin(a)*r*0.5).toFixed(1)+'" stroke="#d9668e" stroke-width="0.7"/>';
      g += '<circle cx="'+(Math.cos(a)*r*0.52).toFixed(1)+'" cy="'+(Math.sin(a)*r*0.52).toFixed(1)+'" r="'+(r*0.07).toFixed(2)+'" fill="#f6d36b"/>';
    }
    return g + '</g>';
  }
  function bud(x, y, r){
    return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+r*0.7+'" ry="'+r+'" fill="#f39bb7" stroke="#e07d9f" stroke-width="0.6"/>';
  }
  function drawBranch(svg){
    var s = '<g class="sway">';
    s += '<path d="M -10 30 C 60 40, 120 70, 200 130 S 290 210, 330 255" stroke="#6b4a3f" stroke-width="8" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 90 55 C 110 30, 140 20, 178 16" stroke="#6b4a3f" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 160 105 C 176 140, 172 172, 160 205" stroke="#6b4a3f" stroke-width="3.8" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 232 168 C 262 150, 284 150, 308 160" stroke="#6b4a3f" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
    s += '<path d="M 40 36 C 46 18, 58 10, 72 6" stroke="#6b4a3f" stroke-width="3" fill="none" stroke-linecap="round"/>';
    var F = [[178,16,15,10],[150,24,13,40],[122,38,12,-20],[72,6,12,15],[45,34,11,60],[200,130,15,0],[222,148,13,30],[160,205,14,-15],[170,172,11,50],[255,190,13,20],[308,160,14,-10],[282,150,11,45],[330,255,15,5],[296,228,13,-30],[100,62,11,25],[20,30,10,0]];
    F.forEach(function(f, i){ s += blossom(f[0], f[1], f[2], f[3], i%3===0 ? '#fbd3df' : (i%3===1 ? '#f9c3d3' : '#fde0e8')); });
    [[190,6],[135,52],[60,52],[242,128],[148,190],[318,180],[268,212]].forEach(function(b){ s += bud(b[0], b[1], 5); });
    s += '</g>';
    svg.innerHTML = s;
  }
  drawBranch(document.getElementById('branchL'));
  drawBranch(document.getElementById('branchR'));
  document.getElementById('badge').innerHTML = blossom(0,0,26,15,'#fde3ea') ;

  /* ---------------- construir el diario ---------------- */
  var book = document.getElementById('book');
  var smallFlower = '<svg viewBox="-20 -20 40 40" aria-hidden="true">' + blossom(0,0,13,10,'#f9c7d6') + '</svg>';
  CHAPTERS.forEach(function(ch, i){
    var sec = document.createElement('section');
    sec.className = 'chapter';
    var tape = document.createElement('div'); tape.className = 'tape'; tape.textContent = ch.t;
    sec.appendChild(tape);
    ch.p.forEach(function(t){ var p = document.createElement('p'); p.textContent = t; sec.appendChild(p); });
    var corner = document.createElement('div'); corner.className = 'corner'; corner.innerHTML = smallFlower;
    sec.appendChild(corner);
    book.appendChild(sec);
    if(i < CHAPTERS.length - 1){
      var d = document.createElement('div'); d.className = 'divider'; d.innerHTML = smallFlower; book.appendChild(d);
    }
  });
  var ending = document.createElement('div');
  ending.className = 'ending';
  ending.innerHTML = '<h2>我爱你</h2><div class="sign">—— Carlos</div><div class="hint">轻触屏幕，会有花瓣和蝴蝶 🌸</div>';
  book.appendChild(ending);

  /* ---------------- abrir ---------------- */
  var cover = document.getElementById('cover'), wrap = document.getElementById('coverWrap');
  var opened = false;
  cover.addEventListener('click', function(){
    if(opened) return; opened = true;
    cover.classList.add('open'); wrap.classList.add('gone');
    var r = cover.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, 40);
    setTimeout(function(){
      document.body.classList.remove('locked');
      book.classList.add('show');
      observe();
      for(var i=0;i<3;i++) flies.push(makeFly(W*Math.random(), H*(0.3+Math.random()*0.5)));
    }, reduced ? 0 : 1100);
  });

  var endingShown = false;
  function observe(){
    var els = document.querySelectorAll('.chapter, .ending');
    if(!('IntersectionObserver' in window)){ els.forEach(function(e){ e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function(list){
      list.forEach(function(it){
        if(!it.isIntersecting) return;
        it.target.classList.add('in'); io.unobserve(it.target);
        if(it.target === ending && !endingShown){
          endingShown = true;
          setTimeout(function(){
            var r = ending.getBoundingClientRect();
            burst(r.left + r.width/2, r.top + 40, 70);
            for(var k=0;k<5;k++) flies.push(makeFly(r.left + r.width/2 + (Math.random()-0.5)*120, r.top + 60, -Math.PI/2 + (Math.random()-0.5)));
          }, 500);
        }
      });
    }, { threshold:0.06, rootMargin:'0px 0px -6% 0px' });
    els.forEach(function(e){ io.observe(e); });
  }

  // barra de progreso
  var bar = document.getElementById('progress');
  window.addEventListener('scroll', function(){
    var max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + '%';
  }, { passive:true });

  // tocar: pétalos (+ a veces una mariposa)
  document.addEventListener('click', function(e){
    if(!opened) return;
    burst(e.clientX, e.clientY, 16);
    if(Math.random() < 0.5 && flies.length < 14) flies.push(makeFly(e.clientX, e.clientY));
  });

  /* ---------------- pétalos (canvas) ---------------- */
  var pc = document.getElementById('petals'), px = pc.getContext('2d');
  var fc = document.getElementById('flies'), fx = fc.getContext('2d');
  var W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [pc, fc].forEach(function(c){ c.width = W*DPR; c.height = H*DPR; });
    px.setTransform(DPR,0,0,DPR,0,0); fx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(); window.addEventListener('resize', resize);

  var PETAL_COLORS = ['#f9c5d5','#f7b2c8','#fbd6e1','#f3a6bf','#fde4ec'];
  function makePetal(x, y, burstMode){
    var a = Math.random()*6.28, v = burstMode ? 1 + Math.random()*3 : 0;
    return {
      x: x != null ? x : Math.random()*W,
      y: y != null ? y : -20 - Math.random()*H,
      s: 5 + Math.random()*6,
      vx: burstMode ? Math.cos(a)*v : 0.2 + Math.random()*0.5,
      vy: burstMode ? Math.sin(a)*v - 1 : 0.5 + Math.random()*0.7,
      rot: Math.random()*6.28, vr: (Math.random()-0.5)*0.04,
      flip: Math.random()*6.28, vf: 0.03 + Math.random()*0.04,
      sway: Math.random()*6.28,
      c: PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)],
      life: 0, max: burstMode ? 160 + Math.random()*80 : Infinity
    };
  }
  var petals = [];
  var NP = Math.round(Math.min(46, Math.max(24, W*H/16000)));
  for(var i=0;i<NP;i++){ var p = makePetal(); p.y = Math.random()*H; petals.push(p); }
  function burst(x, y, n){ if(reduced) return; for(var i=0;i<n;i++) petals.push(makePetal(x, y, true)); }

  function drawPetal(p, alpha){
    var s = p.s;
    px.save();
    px.translate(p.x, p.y);
    px.rotate(p.rot);
    px.scale(1, Math.max(0.15, Math.abs(Math.cos(p.flip))));
    px.globalAlpha = alpha;
    px.beginPath();
    px.moveTo(0, -s*0.75);
    px.quadraticCurveTo(s*0.15, -s*1.05, s*0.38, -s*0.95);
    px.bezierCurveTo(s*0.95, -s*0.5, s*0.6, s*0.7, 0, s);
    px.bezierCurveTo(-s*0.6, s*0.7, -s*0.95, -s*0.5, -s*0.38, -s*0.95);
    px.quadraticCurveTo(-s*0.15, -s*1.05, 0, -s*0.75);
    px.fillStyle = p.c; px.fill();
    px.globalAlpha = alpha*0.5;
    px.beginPath(); px.moveTo(0, s*0.8); px.lineTo(0, -s*0.3);
    px.strokeStyle = '#ffffff'; px.lineWidth = 0.8; px.stroke();
    px.restore();
  }

  /* ---------------- mariposas ---------------- */
  var FLY_PAL = [['#ffd6e6','#f48fb1'],['#e6dcff','#b59cf2'],['#d6f0ff','#8ccaf2'],['#fff0c9','#f6c26b']];
  var flies = [];
  function makeFly(x, y, a){
    var pal = FLY_PAL[Math.floor(Math.random()*FLY_PAL.length)];
    return { x:x, y:y, a: a != null ? a : Math.random()*6.28, sp:0.6 + Math.random()*0.5, turn:0,
             size:9 + Math.random()*8, ph:Math.random()*6.28, flap:0.16 + Math.random()*0.06,
             pal:pal, life:0, max: 900 + Math.random()*600 };
  }
  function drawFly(f, alpha){
    var s = f.size, flap = Math.abs(Math.cos(f.ph))*0.82 + 0.18;
    fx.save(); fx.translate(f.x, f.y); fx.rotate(f.a + Math.PI/2); fx.globalAlpha = alpha;
    var g = fx.createLinearGradient(0,-s,s*1.2,s);
    g.addColorStop(0, f.pal[0]); g.addColorStop(1, f.pal[1]);
    for(var side=-1; side<=1; side+=2){
      fx.save(); fx.scale(side*flap, 1);
      fx.beginPath();
      fx.moveTo(0,0);
      fx.bezierCurveTo(s*0.25,-s*1.0, s*1.25,-s*1.15, s*1.15,-s*0.2);
      fx.bezierCurveTo(s*0.95,s*0.1, s*0.35,s*0.1, 0,0);
      fx.moveTo(0,0);
      fx.bezierCurveTo(s*0.85,s*0.1, s*1.05,s*0.95, s*0.5,s*0.85);
      fx.bezierCurveTo(s*0.18,s*0.75, 0,s*0.32, 0,0);
      fx.fillStyle = g; fx.fill();
      fx.strokeStyle = 'rgba(160,80,120,0.35)'; fx.lineWidth = 0.8; fx.stroke();
      fx.restore();
    }
    fx.strokeStyle = '#7a4a63'; fx.lineWidth = 1.4; fx.lineCap = 'round';
    fx.beginPath(); fx.moveTo(0,-s*0.4); fx.lineTo(0,s*0.55); fx.stroke();
    fx.lineWidth = 0.9;
    fx.beginPath(); fx.moveTo(0,-s*0.4); fx.quadraticCurveTo(-s*0.15,-s*0.7,-s*0.28,-s*0.8);
    fx.moveTo(0,-s*0.4); fx.quadraticCurveTo(s*0.15,-s*0.7,s*0.28,-s*0.8); fx.stroke();
    fx.restore();
  }

  /* ---------------- bucle ---------------- */
  var last = 0;
  function frame(now){
    var dt = last ? Math.min(3, (now-last)/16.67) : 1; last = now;
    px.clearRect(0,0,W,H); fx.clearRect(0,0,W,H);

    for(var i=petals.length-1;i>=0;i--){
      var p = petals[i];
      p.life += dt;
      if(p.max !== Infinity){
        p.vx *= 0.985; p.vy = p.vy*0.985 + 0.03*dt;
        if(p.life > p.max){ petals.splice(i,1); continue; }
      }
      p.sway += 0.02*dt;
      p.x += (p.vx + Math.sin(p.sway)*0.4)*dt;
      p.y += p.vy*dt;
      p.rot += p.vr*dt; p.flip += p.vf*dt;
      if(p.max === Infinity && (p.y > H + 20 || p.x > W + 30)){
        p.y = -20; p.x = Math.random()*W*1.1 - W*0.1;
      }
      var a = p.max === Infinity ? 0.85 : Math.min(1, 1 - p.life/p.max + 0.2);
      drawPetal(p, a);
    }

    for(var f=flies.length-1; f>=0; f--){
      var b = flies[f];
      b.life += dt;
      if(b.life > b.max){ flies.splice(f,1); continue; }
      b.turn += (Math.random()-0.5)*0.012*dt;
      b.turn = Math.max(-0.035, Math.min(0.035, b.turn));
      b.a += b.turn*dt;
      b.x += Math.cos(b.a)*b.sp*dt; b.y += Math.sin(b.a)*b.sp*dt;
      b.ph += b.flap*dt;
      var M = 40;
      if(b.x < -M) b.x = W+M; if(b.x > W+M) b.x = -M;
      if(b.y < -M) b.y = H+M; if(b.y > H+M) b.y = -M;
      var fade = Math.min(1, b.life/40) * Math.min(1, (b.max - b.life)/80);
      drawFly(b, fade*0.9);
    }
    // siempre hay un par de mariposas paseando
    if(opened && flies.length < 3 && Math.random() < 0.01) flies.push(makeFly(-30, H*(0.2+Math.random()*0.6), (Math.random()-0.5)*0.6));

    requestAnimationFrame(frame);
  }
  if(!reduced) requestAnimationFrame(frame);
})();
</script>
